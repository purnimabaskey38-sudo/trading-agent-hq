name: Update Stock Data
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Python script safely
        run: |
          if [ -f "fetch_data.py" ]; then
            python fetch_data.py
          elif [ -f "Trading Agent HQ/fetch_data.py" ]; then
            python "Trading Agent HQ/fetch_data.py"
          else
            find . -name "fetch_data.py" -exec python {} \;
          fi

      - name: Save generated data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mv -f data.json "Trading Agent HQ/data.json" || true
          git add -A
          git commit -m "Auto update stock data" || echo "No changes to commit"
          git push
